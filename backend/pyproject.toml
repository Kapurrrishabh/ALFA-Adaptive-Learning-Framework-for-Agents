[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alfa"
version = "0.2.0"
description = "ALFA: a self-learning financial agent written from scratch in NumPy, and the StockIntel advisory app built on it"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "yfinance>=0.2.50",
    "feedparser>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "anthropic>=1.0",
    "httpx>=0.27",
    "websockets>=13",
    "curl_cffi>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# collecting the training corpus (backend/database/dataforge); the app never needs these
collect = ["requests>=2.31", "beautifulsoup4>=4.12", "pypdf>=4", "py7zr>=0.20"]
# open-source forecast models (Chronos, Kronos); ~1 GB of downloads, so the server image leaves them out
ml = ["torch>=2.2", "chronos-forecasting>=2.0", "einops>=0.7"]
# a server without torch: models from a Hugging Face Space, state in a Hugging Face dataset
cloud = ["gradio_client>=2.0", "huggingface_hub>=0.30"]

[project.scripts]
stockintel = "backend.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["knowledge_base/lessons/*.md", "advisory/calculators/resources/*.csv", "models/configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
