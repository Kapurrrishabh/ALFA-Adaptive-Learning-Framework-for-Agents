[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stockintel"
version = "0.1.0"
description = "Personal AI stock market intelligence and decision-support platform (evidence-first, India-first)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "yfinance>=0.2.50",
    "feedparser>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "anthropic>=1.0",
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# open-source forecast models (Chronos, Kronos); ~1 GB of downloads, so the server image leaves them out
ml = ["torch>=2.2", "chronos-forecasting>=2.0", "einops>=0.7"]

[project.scripts]
stockintel = "stockintel.cli:main"

[tool.setuptools.packages.find]
include = ["stockintel*"]

[tool.setuptools.package-data]
stockintel = ["knowledge_base/*.md", "resources/*.csv", "web/*", "web/app/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
